# Defaults. The environment's own values live in the infra repository, next to the deploy workflow,
# the same split katcher, metrik and tracy use.

# Required. An empty hostname renders `Host(``)`, which Traefik accepts and which then matches
# nothing at all — a route that is present, valid and silently dead. The template fails instead.
hostname: ""

image:
  repository: ghcr.io/youndie/kobweb-ssr-experiment
  # Both containers are versioned together on purpose: the renderer fetches pages from the site
  # beside it and bakes its stylesheets, so a mismatched pair produces pages that look plausible
  # and are wrong in ways nothing checks.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicas: 1

# Memory figures below are cgroup accounting, not summed RSS.
#
# The first version of this file reserved 960 MiB and capped at 2 GiB, from a measurement that
# added up RSS across the renderer's process tree. That counts Chromium's shared pages once per
# process and came out 2.4x too high. By cgroup — which counts a page once — the renderer is about
# 68 MiB fixed plus 144 MiB per worker, and the site about 190 MiB under load. Requests reserve
# node capacity whether or not anything uses them, so the wrong number was being taken out of the
# cluster continuously.
#
# Verified at these limits under three rounds of eight concurrent renders plus every page: both
# containers settled under 195 MiB and neither was OOMKilled.

site:
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 384Mi }

renderer:
  # Pool size is bounded by memory rather than cores: about 144 MiB per worker on top of 68 MiB
  # fixed, measured by cgroup at 1, 2 and 4 workers (212, 356, 643 MiB under load — a clean linear
  # fit). One worker is enough for a demo; raising this without raising the memory limit buys
  # nothing but an OOMKill.
  workers: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 512Mi }

ssr:
  cache:
    enabled: true
    ttlSeconds: 300

traefik:
  entryPoint: websecure
  certResolver: cloudflare
  # An http route that redirects to https, plus the middleware to do it with.
  #
  # **Off by default, and measured rather than assumed.** On the cluster this was built for, plain
  # http answers 404 for every host — including a neighbour that has shipped exactly this route for
  # ten days — so the `web` entrypoint is not served there and the redirect happens before Traefik
  # sees the request. A route that provably matches nothing is worse than no route: it reads as
  # working. Turn it on where http actually reaches Traefik.
  #
  # The middleware is shipped rather than borrowed from a neighbouring namespace: Traefik resolves
  # middlewares in the route's own namespace, and with `allowCrossNamespace` off a qualified name
  # does not resolve — at which point Traefik drops the route instead of complaining. A
  # `redirectScheme` is safe to copy in a way a `forwardAuth` is not; it references nothing outside
  # itself. Set `createMiddleware` to false where the namespace already has one under this name.
  httpRedirect:
    enabled: false
    createMiddleware: true
    middlewareName: redirect-to-https
